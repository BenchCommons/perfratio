[package]
authors = [
    "Matheus Breguêz <matbrgz@gmail.com>",
    "David Peter <mail@david-peter.de>",
]
categories = ["command-line-utilities"]
description = "Multi-dimensional command-line benchmarking tool with Performance per Watt, Hardware Counter Ratios, and Deep Statistics"
license = "MIT OR Apache-2.0"
name = "perfratio"
readme = "README.md"
repository = "https://github.com/BenchCommons/perfratio"
version = "1.0.0"
edition = "2021"
build = "build.rs"
rust-version = "1.88.0"
# Only ship what is needed to build, test and document the crate
# (no CI config, specs, scripts or images).
include = [
    "/src/**/*",
    "/build.rs",
    "/tests/**/*",
    "/doc/perfratio.1",
    "/docs/schema/*.json",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

# Prebuilt binaries for `cargo binstall perfratio`, matching the release archives
# built by .github/workflows/CICD.yml: perfratio-v<version>-<target>.tar.gz (.zip on
# Windows) containing perfratio-v<version>-<target>/perfratio(.exe).
# The extension is spelled out because binstall's { archive-suffix } is ".tgz".
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.i686-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[features]
# `cli` (default): the command-line front end (clap argument parsing, shell
# completions, progress bars). Library users can build with
# `default-features = false` to leave out `clap`, `clap_complete` and
# `indicatif`. The `perfratio` binary requires it.
default = ["cli"]
cli = ["dep:clap", "dep:clap_complete", "dep:indicatif"]
# Use the nightly feature windows_process_extensions_main_thread_handle
windows_process_extensions_main_thread_handle = []

# Honors PERFRATIO_SYSTEM_CHECK_ROOT (a fake /proc and /sys tree). Test-only:
# enabled for `cargo test` through the dev-dependency on this crate below.
test-hooks = []

[[bin]]
name = "perfratio"
path = "src/main.rs"
required-features = ["cli"]

# MCP server for agents (#386): JSON-RPC over stdio, no extra dependencies
[[bin]]
name = "perfratio-mcp"
path = "src/bin/perfratio-mcp.rs"

[dependencies]
colored = "2.1"
indicatif = { version = "0.18", optional = true }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = "1.36"
rand = "0.8"
shell-words = "1.0"
thiserror = "2.0"
anyhow = "1.0"
clap_complete = { version = "4.2", optional = true }
ctrlc = { version = "3.4", features = ["termination"] }
regex = "1.11"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(all(windows, not(windows_process_extensions_main_thread_handle)))'.dependencies]
once_cell = "1.19"

[target.'cfg(target_os="linux")'.dependencies]
nix = { version = "0.31", features = ["zerocopy"] }

[dependencies.clap]
version = "4"
default-features = false
optional = true
features = [
    "std",
    "suggestions",
    "color",
    "wrap_help",
    "cargo",
    "help",
    "usage",
    "error-context",
]

[dev-dependencies]
approx = "0.5"
# Turns on the `test-hooks` feature for tests (the integration tests run the real binary)
perfratio = { path = ".", features = ["test-hooks"] }
assert_cmd = "2.0"
insta = { version = "1.41.1", features = ["yaml"] }
# Validates the JSON export against docs/schema (tests/json_schema_tests.rs)
jsonschema = { version = "0.63", default-features = false }
predicates = "3.1"
tempfile = "3.23"

[target.'cfg(not(windows))'.dev-dependencies]
libc = "0.2"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[build-dependencies]
clap = { version = "4.5", features = ["cargo"] }
clap_complete = "4.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
